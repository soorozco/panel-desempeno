# Mantiene activo el proyecto de Supabase (plan gratuito).
# Supabase pausa los proyectos gratuitos tras ~7 días sin actividad;
# esta tarea hace una consulta mínima a la base dos veces por semana.
# Nota: GitHub desactiva las tareas programadas si el repo pasa 60 días
# sin commits; te avisa por correo y se reactiva con un clic en Actions.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 9 * * 1,4" # lunes y jueves, 09:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar la base de datos
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js | head -1)
          KEY=$(grep -o 'eyJ[A-Za-z0-9._-]*' config.js | head -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "config.js sin claves (modo local): no hay nada que mantener activo."
            exit 0
          fi
          CODE=$(curl -s -o /tmp/out.txt -w "%{http_code}" --max-time 30 \
            "$URL/rest/v1/workers?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Respuesta HTTP: $CODE"
          if [ "$CODE" != "200" ]; then
            cat /tmp/out.txt
            echo "Supabase no respondió bien: revisa si el proyecto está pausado."
            exit 1
          fi
